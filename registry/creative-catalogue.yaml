# Creative catalogue v1 — client-agnostic ad formats x shot archetypes x text layouts.
# Text zone "none" means no text: a format with text layers may only allow shots whose text_zone is not none.
# Validated by schemas/creative-catalogue-v1.schema.json; loaded by service/catalogue/creative.py.
#
# Template placeholders are either a declared slot, a craft key ({lens} {aperture} {light} {angle} {finish},
# filled from the shot's craft defaults), or a client/compiler key ({scene_palette} from the client pack,
# {text_space} from the shot's text_zone). Text is never rendered by the model; it is composited later into
# the shot's text_zone, so every generated template ends "No text, no logos".
# Industry restrictions (e.g. regulated claims) come from the client pack, never from this file.
schema_version: 1
version: '1.2.0'
# Specs written for these versions still compile: 1.2.0 only added shots (pattern_interrupt, visual_metaphor).
compatible_with: ['1.1.0']

# Realism (what makes a generated photo read as a real post, not stock). Ported from the FounderOS creative engine's
# UGC prompt banks (MIT), adapted to stills. Forbidden words may never appear in a positive prompt (templates, craft,
# banks or slot values); each shot names which cue banks it takes (`realism`), one cue per bank, picked
# deterministically from the filled slots.
realism:
  forbidden_words: [cinematic, professional, stunning, 8k, studio, perfect, flawless, editorial, glamour, hdr, hyperrealistic, award-winning, masterpiece]
  banks:
    skin:
      - natural skin texture with visible pores
      - a few faint freckles
      - slight redness around the nose
      - uneven skin tone under the eyes
      - faint lines at the corners of the eyes
    pose:
      - eyes drifting just off camera
      - a small head tilt mid-sentence
      - weight shifted onto one leg
      - a hand caught mid-gesture
      - a half laugh, caught between expressions
      - one shoulder slightly raised, relaxed
    imperfection:
      - framing slightly off centre
      - a little phone-camera grain in the shadows
      - a soft highlight from the window, slightly blown out
      - mixed colour temperature between daylight and a lamp
      - one edge of the frame softly out of focus
      - an everyday object half in frame at the edge

formats:
  - id: feed_single_image
    label: Feed single image
    channel_formats:
      - meta_ads.single_image_ad
      - instagram.feed_post
      - facebook.feed_post
      - linkedin.feed_post
      - reddit_ads.promoted_post
    canvases: ["1:1", "4:5"]
    shots_allowed: [lifestyle_moment, outcome_confidence, delivery_moment, hands_detail, product_hero, flat_lay, founder_team, pattern_interrupt, visual_metaphor]
    layout: stack_top_left
    text_layers: {headline_max: 40, body_max: 90, cta_max: 20, disclaimer: true}

  - id: story_vertical
    label: Story / reel cover (vertical)
    channel_formats:
      - instagram.reel
      - meta_ads.single_image_ad
    canvases: ["9:16"]
    shots_allowed: [lifestyle_moment, outcome_confidence, delivery_moment, hands_detail, product_hero, founder_team, pattern_interrupt, visual_metaphor]
    layout: stack_top
    text_layers: {headline_max: 36, body_max: 60, cta_max: 18, disclaimer: true}

  - id: carousel_card
    label: Carousel card
    channel_formats:
      - meta_ads.carousel_ad
    canvases: ["4:5"]
    shots_allowed: [lifestyle_moment, outcome_confidence, delivery_moment, hands_detail, product_hero, flat_lay, founder_team, pattern_interrupt, visual_metaphor]
    layout: stack_bottom
    text_layers: {headline_max: 32, body_max: 60, cta_max: 18, disclaimer: true}

  - id: landscape_banner
    label: Landscape banner
    channel_formats:
      - google_ads.performance_max_asset
    canvases: ["16:9"]
    shots_allowed: [lifestyle_moment, outcome_confidence, delivery_moment, product_hero, flat_lay, pattern_interrupt, visual_metaphor]
    layout: stack_left
    text_layers: {headline_max: 30, body_max: 90, cta_max: 15, disclaimer: true}

  - id: library_plate
    label: Library plate (logo only)
    channel_formats:
      - instagram.feed_post
      - facebook.feed_post
      - linkedin.feed_post
      - instagram.reel
    canvases: ["1:1", "4:5", "9:16"]
    shots_allowed: [lifestyle_moment, outcome_confidence, delivery_moment, hands_detail, product_hero, flat_lay, environment_scene]
    layout: logo_only
    text_layers: {headline_max: 0, body_max: 0, cta_max: 0, disclaimer: false}

shots:
  - id: lifestyle_moment
    label: Lifestyle moment
    people: buyer_models
    requires_product_image: false
    craft:
      lens: 35mm lens
      aperture: f/2.8
      light: Soft natural directional light from one side
      angle: eye-level medium shot
      finish: true-to-life colour, fine film grain
    realism: [skin, pose, imperfection]
    text_zone: top_left
    prompt_template: "Candid lifestyle photograph. {subject} {action} in {setting}, {expression}. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. No text, no logos."
    slots:
      - {key: subject, required: true, min_chars: 12, max_chars: 90}
      - {key: action, required: true, min_chars: 6, max_chars: 80}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
      - {key: expression, required: true, min_chars: 4, max_chars: 60}
    negative: [posed stock-photo smile, plastic skin, distorted hands, cluttered background, text or watermark]

  - id: outcome_confidence
    label: Outcome / confidence portrait
    people: buyer_models
    requires_product_image: false
    craft:
      lens: 85mm lens
      aperture: f/2
      light: Warm soft directional light with gentle fill
      angle: chest-up portrait from slightly below eye level
      finish: sharp eyes, true-to-life colour, fine film grain
    realism: [skin, pose, imperfection]
    text_zone: left
    prompt_template: "Natural portrait photograph. {subject} {action}, {expression}, in {setting}. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. No text, no logos."
    slots:
      - {key: subject, required: true, min_chars: 12, max_chars: 90}
      - {key: action, required: true, min_chars: 6, max_chars: 80}
      - {key: expression, required: true, min_chars: 4, max_chars: 60}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
    negative: [before-and-after split, exaggerated grin, plastic skin, stiff studio pose, text or watermark]

  - id: delivery_moment
    label: Delivery moment
    people: buyer_models
    requires_product_image: false
    craft:
      lens: 35mm lens
      aperture: f/4
      light: Bright even natural light
      angle: over-the-shoulder medium-wide shot
      finish: true-to-life colour, clean detail, documentary feel
    realism: [pose, imperfection]
    text_zone: top
    prompt_template: "Documentary photograph. {subject} {action} at {setting}, {expression}. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. No text, no logos."
    slots:
      - {key: subject, required: true, min_chars: 12, max_chars: 90}
      - {key: action, required: true, min_chars: 6, max_chars: 80}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
      - {key: expression, required: true, min_chars: 4, max_chars: 60}
    negative: [staged handshake, uniforms with readable text, distorted hands, crowded frame, text or watermark]

  - id: hands_detail
    label: Hands detail
    people: buyer_models
    requires_product_image: false
    craft:
      lens: 100mm macro lens
      aperture: f/4
      light: Soft directional light with gentle shadows
      angle: tight close-up from slightly above
      finish: fine texture detail, shallow depth of field
    realism: [imperfection]
    text_zone: top
    prompt_template: "Close-up detail photograph. Hands {action}, {detail}, in {setting}. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. No text, no logos."
    slots:
      - {key: action, required: true, min_chars: 6, max_chars: 80}
      - {key: detail, required: true, min_chars: 6, max_chars: 80}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
    negative: [extra fingers, fused fingers, faces in frame, jewellery clutter, text or watermark]

  - id: product_hero
    label: Product hero
    people: none
    requires_product_image: true
    craft:
      lens: 100mm lens
      aperture: f/8
      light: Large softbox key light with a subtle rim light
      angle: three-quarter view at product height
      finish: crisp edges, clean reflections, accurate colour
    realism: []
    text_zone: top
    prompt_template: "Commercial product photograph. The product from the reference image, {placement}, on {surface}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. Keep the product exactly as shown. No added text, no added logos."
    slots:
      - {key: placement, required: true, min_chars: 6, max_chars: 80}
      - {key: surface, required: true, min_chars: 6, max_chars: 80}
    negative: [altered product shape, changed label, duplicate products, floating props, text or watermark]

  - id: flat_lay
    label: Flat lay
    people: none
    requires_product_image: true
    craft:
      lens: 50mm lens
      aperture: f/8
      light: Even diffused light from above
      angle: straight top-down
      finish: soft clean shadows, accurate colour, crisp detail
    realism: []
    text_zone: bottom
    prompt_template: "Overhead flat lay photograph. The product from the reference image arranged with {props} on {surface}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. Keep the product exactly as shown. No added text, no added logos."
    slots:
      - {key: props, required: true, min_chars: 6, max_chars: 90}
      - {key: surface, required: true, min_chars: 6, max_chars: 80}
    negative: [altered product shape, changed label, tilted perspective, overcrowded props, text or watermark]

  - id: environment_scene
    label: Environment scene (text-free brand plate)
    people: none
    requires_product_image: false
    craft:
      lens: 24mm tilt-shift lens
      aperture: f/8
      light: Soft natural daylight
      angle: eye-level wide shot with straight verticals
      finish: clean lines, natural colour, calm composition
    realism: [imperfection]
    text_zone: none
    prompt_template: "Architectural photograph. {setting}, {details}, empty of people. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. No text, no logos, no signage."
    slots:
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
      - {key: details, required: true, min_chars: 6, max_chars: 90}
    negative: [people, readable signage, converging verticals, harsh flash, text or watermark]

  # Attention patterns (registry/attention-patterns.yaml in Marketing OS): pictures that stop the scroll without people.
  - id: pattern_interrupt
    label: Pattern interrupt (familiar object out of place)
    people: none
    requires_product_image: false
    craft:
      lens: 35mm lens
      aperture: f/4
      light: Soft natural light from one side
      angle: eye-level medium shot
      finish: true-to-life colour, fine film grain
    realism: [imperfection]
    text_zone: top_left
    prompt_template: "Photograph. {object} where it does not belong: {setting}, {detail}. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. No text, no logos."
    slots:
      - {key: object, required: true, min_chars: 6, max_chars: 80}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
      - {key: detail, required: true, min_chars: 6, max_chars: 90}
    negative: [people, cartoon style, distorted proportions, cluttered background, text or watermark]

  - id: visual_metaphor
    label: Visual metaphor (show the idea, do not explain it)
    people: none
    requires_product_image: false
    craft:
      lens: 50mm lens
      aperture: f/5.6
      light: Soft diffused daylight
      angle: straight-on medium shot
      finish: clean natural colour, calm composition
    realism: [imperfection]
    text_zone: top
    prompt_template: "Photograph. A visual metaphor for {idea}: {metaphor_scene}, in {setting}. {realism}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}. No text, no logos."
    slots:
      - {key: idea, required: true, min_chars: 6, max_chars: 80}
      - {key: metaphor_scene, required: true, min_chars: 12, max_chars: 120}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
    negative: [people, cartoon style, surreal distortion, cluttered background, text or watermark]

  # Never generated: the owner supplies real photos of themselves/their team. The template is the brief the
  # owner photo is checked against, and is never sent to an image model.
  - id: founder_team
    label: Founder / team (owner photo)
    people: owner_photo_only
    requires_product_image: false
    craft:
      lens: 50mm lens
      aperture: f/2.8
      light: Soft natural light, no flash
      angle: eye-level waist-up shot
      finish: natural skin texture, true-to-life colour
    realism: []
    text_zone: left
    prompt_template: "Owner-supplied photograph. {subject} in {setting}. {light}. {scene_palette}. Shot on {lens}, {aperture}, {angle}, {finish}. {text_space}."
    slots:
      - {key: subject, required: true, min_chars: 12, max_chars: 90}
      - {key: setting, required: true, min_chars: 6, max_chars: 90}
    negative: [generated faces, altered likeness, heavy retouching]

layouts:
  - {id: stack_top_left, text_zone: top_left, stack: [headline, body, cta, disclaimer], scrim: behind_text}
  - {id: stack_top, text_zone: top, stack: [headline, body, cta, disclaimer], scrim: behind_text}
  - {id: stack_bottom, text_zone: bottom, stack: [headline, body, cta, disclaimer], scrim: behind_text}
  - {id: stack_left, text_zone: left, stack: [headline, body, cta, disclaimer], scrim: behind_text}
  - {id: logo_only, text_zone: none, stack: [], scrim: none}
